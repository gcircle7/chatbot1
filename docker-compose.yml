services:

  # ── 인프라 ──────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chatbotdb}
      MYSQL_USER: ${MYSQL_USER:-dbadm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Backend/chatbot_api/scripts/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 외부 직접 접근 차단 — 앱 컨테이너에서만 접근
    expose:
      - "3306"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 비밀번호 설정 (선택: REDIS_PASSWORD 환경변수 사용 시 활성화)
    # command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    expose:
      - "6379"

  # ── 애플리케이션 ─────────────────────────────────────────
  chatbot-api:
    build:
      context: ./Backend/chatbot_api
      # CentOS/Ubuntu 배포 서버 대비 플랫폼 명시
      # 빌드 머신이 ARM(M1/M2 Mac)이면 linux/amd64 로 강제
      # x86_64 Windows/Linux 이면 주석 그대로 유지
      # platforms:
      #   - linux/amd64
    image: chatbot-api:latest
    restart: unless-stopped
    env_file:
      - ./secrets/chatbot_api.env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    expose:
      - "8006"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  chatbot-server:
    build:
      context: ./Backend/chatbot_server
    image: chatbot-server:latest
    restart: unless-stopped
    env_file:
      - ./secrets/chatbot_server.env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      chatbot-api:
        condition: service_started

  chatbot-frontend:
    build:
      context: ./Frontend/python
    image: chatbot-frontend:latest
    restart: unless-stopped
    env_file:
      - ./secrets/chatbot_frontend.env
    environment:
      # 컨테이너 내부 서비스 이름으로 api 호출
      CHATBOT_API_BASE: http://chatbot-api:8006
    ports:
      - "8000:8000"
    depends_on:
      - chatbot-api

volumes:
  mysql_data:
  redis_data:
