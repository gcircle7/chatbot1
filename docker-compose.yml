services:

  # ── 인프라 ──────────────────────────────────────────────
  # MySQL: 호스트 서버의 기존 MySQL 을 그대로 사용
  #   Windows(Docker Desktop): MYSQL_HOST=host.docker.internal
  #   Linux(CentOS/Ubuntu):    MYSQL_HOST=172.17.0.1  또는 host-gateway

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    expose:
      - "6379"

  # ── 애플리케이션 ─────────────────────────────────────────
  chatbot-api:
    build:
      context: ./Backend/chatbot_api
    image: chatbot-api:latest
    restart: unless-stopped
    env_file:
      - ./secrets/chatbot_api.env
    environment:
      # 호스트 MySQL 접속 주소 — 환경에 맞게 .env 에서 MYSQL_HOST 를 설정
      # Windows : MYSQL_HOST=host.docker.internal
      # Linux   : MYSQL_HOST=172.17.0.1
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    extra_hosts:
      # Linux 에서 host.docker.internal 이 없을 때 자동 해결
      - "host.docker.internal:host-gateway"
    ports:
      - "8006:8006"
    depends_on:
      redis:
        condition: service_healthy

  chatbot-server:
    build:
      context: ./Backend/chatbot_server
    image: chatbot-server:latest
    restart: unless-stopped
    env_file:
      - ./secrets/chatbot_server.env
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      chatbot-api:
        condition: service_started

  chatbot-frontend:
    build:
      context: ./Frontend/python
    image: chatbot-frontend:latest
    restart: unless-stopped
    env_file:
      - ./secrets/chatbot_frontend.env
    environment:
      CHATBOT_API_BASE: http://chatbot-api:8006
    ports:
      - "8000:8000"
    depends_on:
      - chatbot-api

volumes:
  redis_data:
