<!DOCTYPE html> 
<html lang="ko" class="{% if embed %}chat-embed{% endif %}">  
  
<head>  
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@200&family=Nanum+Gothic&family=Nanum+Myeongjo&family=Noto+Sans+KR:wght@400&family=Roboto:wght@100&display=swap">
    <title>민지의 chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.7/handlebars.min.js"></script>
</head>

<body{% if embed %} data-login-id="{{ login_id }}"{% endif %}>
    <div class="container clearfix">
        <div class="chat">
            <div class="chat-header clearfix">
                <div class="chat-header-row chat-header-top">
                    <img style="width:60px; border-radius:50px; margin-left:10px;" src="{{ url_for('static', filename='images/logo.png') }}" alt="avatar" />
                    <div class="chat-about">내 찐친 고비</div>
                </div>
                <!-- <div class="chat-header-row chat-header-bottom">
                    <div class="user-info">
                        <span class="user-name">{{ display_name }}</span>
                    </div>
                </div> -->
            </div> <!-- end chat-header -->

            <div class="chat-history"> 
                <ul style="list-style:none;">

                </ul>
            </div> <!-- end chat-history -->

            <div class="chat-message">
                <span class=info></span>
                <textarea name="message-to-send" id="message-to-send" placeholder="메시지를 입력하세요." rows="1"></textarea> 
                <div>
                    <input type="hidden" id="db_user_id" style="display:none" value="{{ db_user_id }}">
                    <input type="hidden" id="display_name" style="display:none" value="{{ display_name }}">
                    <input type="hidden" id="session_token" style="display:none" value="{{ session_token }}">
                    <input type="file" id="image-upload" style="display:none">
                    <button id="send" style="display:none">Send</button>
                </div>
            </div> <!-- end chat-message -->
        </div> <!-- end chat -->
    </div> <!-- end container -->
    <audio id="audioPlayer" controls style="display:none"></audio>
    
     <script id="message-template" type="text/x-handlebars-template">
         {% raw %}
        <li class="clearfix" data-ts="{{ts}}">
            <div class="message-data align-right">                
                <span class="message-data-name" >{{ display_name }}</span>
                <span class="message-data-time" >{{time}}</span> &nbsp; &nbsp;                
            </div>
            <div class="message my-message float-right">
                {{messageOutput}}
            </div>
      </li>
      {% endraw %}
    </script>

    <script id="message-response-template" type="text/x-handlebars-template">
        {% raw %}
        <li class="clearfix" data-ts="{{ts}}">
            <div class="message-data">
                <img src="/static/images/jjinchin.png" class="face-image">
                <span class="message-data-name">내 찐친</span>
                <span class="message-data-time">{{time}}</span>
            </div>
            <div class="message other-message float-left">
                {{#if loading}}
                    <div class="loading-dots"><span></span><span></span><span></span></div>
                {{else}}
                    {{{messageOutput}}}
                {{/if}}                
            </div>
        </li>      
        {% endraw %}
    </script>
    <script>
        (function () {
            async function fetchResponse(message) {
                const response = await fetch("http://localhost:8006/chat-api", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        db_user_id: document.getElementById('db_user_id').value,
                        session_token: document.getElementById('session_token').value,
                        request_message: message
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                else {
                    const data = await response.json();
                    if (data['status'] == 'failed' || data['status'] == 'error') {
                        console.error(data['error_message']);
                    }
                    return data;
                }
            }

            var chat = {
                messageToSend: '',
                init: function () {
                    this.cacheDOM();
                    this.bindEvents();
                    if (this.isEmbedMode()) {
                        this.restoreHistory();
                    }
                },
                isEmbedMode: function () {
                    return document.documentElement.classList.contains('chat-embed');
                },
                getHistoryStorageKey: function () {
                    var loginId = document.body.getAttribute('data-login-id') || 'guest';
                    return 'gobi_embed_chat_history_' + loginId;
                },
                persistHistory: function () {
                    if (!this.isEmbedMode() || !this.chatHistoryList) {
                        return;
                    }
                    try {
                        sessionStorage.setItem(
                            this.getHistoryStorageKey(),
                            this.chatHistoryList.innerHTML
                        );
                    } catch (err) {
                        console.warn('chat history save failed', err);
                    }
                },
                restoreHistory: function () {
                    if (!this.isEmbedMode() || !this.chatHistoryList) {
                        return;
                    }
                    try {
                        var saved = sessionStorage.getItem(this.getHistoryStorageKey());
                        if (saved) {
                            this.chatHistoryList.innerHTML = saved;
                            this.refreshTimestamps();
                            this.scrollToBottom();
                        }
                    } catch (err) {
                        console.warn('chat history restore failed', err);
                    }
                },
                // 로그인 사용자 표시 이름 (사용자 메시지 라벨)
                getDisplayName: function () {
                    var el = document.getElementById('display_name');
                    return (el && el.value) ? el.value : '';
                },
                // 복원된 이력의 시각을 data-ts 기준으로 다시 계산 (자정 넘김 대응)
                refreshTimestamps: function () {
                    if (!this.chatHistoryList) {
                        return;
                    }
                    var items = this.chatHistoryList.querySelectorAll('li[data-ts]');
                    for (var i = 0; i < items.length; i++) {
                        var ts = items[i].getAttribute('data-ts');
                        if (!ts) {
                            continue;
                        }
                        var timeEl = items[i].querySelector('.message-data-time');
                        if (timeEl) {
                            timeEl.textContent = this.formatTimestamp(ts);
                        }
                    }
                },
                // Cache DOM elements
                cacheDOM: function () {
                    this.chatHistory = document.querySelector('.chat-history');
                    this.button = document.querySelector('#send');
                    this.textarea = document.getElementById('message-to-send');
                    this.chatHistoryList = this.chatHistory.querySelector('ul');
                },
                // Bind events to elements
                bindEvents: function () {
                    this.button.addEventListener('click', this.addMessage.bind(this));
                    this.textarea.addEventListener('keyup', this.addMessageEnter.bind(this));
                },
                // Render a new message
                render: function (message, isUser) {
                    //this.scrollToBottom();

                    const templateId = isUser ? "#message-template" : "#message-response-template";
                    const template = Handlebars.compile(document.querySelector(templateId).innerHTML);

                    const now = new Date();
                    const context = {
                        messageOutput: message,
                        display_name: this.getDisplayName(),
                        ts: now.toISOString(),
                        time: this.formatTimestamp(now)
                    };

                    let htmlString = template(context)
                    
                    this.chatHistoryList.insertAdjacentHTML('beforeend', htmlString);
                    this.scrollToBottom();
                    this.persistHistory();

                    if (isUser) {
                        this.textarea.value = '';
                    }
                },
                showResponse:  function (message) {
                    this.scrollToBottom();
                    const templateId = "#message-response-template";
                    let templateSource = document.querySelector(templateId).innerHTML;
                    const template = Handlebars.compile(templateSource);
                    const now = new Date();
                    const context = {
                        messageOutput: message,
                        ts: now.toISOString(),
                        time: this.formatTimestamp(now)
                    };
                    let htmlString = template(context);
    
                    document.querySelector('.chat-history > ul > li:last-child').innerHTML = htmlString;
                    this.scrollToBottom();
                    this.persistHistory();
                },
                 // 일정 시간(seconds) 경과 시점을 알릴 수 있는 비동기 함수
                waitSeconds: async function (delay) {
                    return new Promise(resolve => {
                        setTimeout(() => {
                            resolve();
                        }, delay + this.waitTime);
                        this.waitTime = 0;
                    });
                },
                showBubbleAfterSeconds: async function (delay) {
                    return new Promise(resolve => {
                        setTimeout(() => {
                            const templateId = "#message-response-template";
                            const template = Handlebars.compile(document.querySelector(templateId).innerHTML);
                            const now = new Date();
                            const context = {
                                loading: true,
                                ts: now.toISOString(),
                                time: this.formatTimestamp(now)
                            };
                            // 물방울 애니메이션을 시작합니다.
                            var loadingHtml = template(context);
                            this.chatHistoryList.insertAdjacentHTML('beforeend', loadingHtml);
                            this.scrollToBottom();
                            this.persistHistory();
                            resolve();
                        }, delay);
                    });
                },

                // Add a message and its response
                addMessage: async function () {
                    this.messageToSend = this.textarea.value.trim();
                    if (!this.messageToSend) return; // 빈 메시지는 보내지 않음
                    this.render(this.messageToSend, true);

                    showBubblePromise = this.showBubbleAfterSeconds(500)
                    waitPromise = this.waitSeconds(3500)
                    let resp_msg;
                    try {
                        const resp = await fetchResponse(this.messageToSend);
                        // resp가 객체이고, status가 "error"라면 error_message를 alert로 표시
                        console.log("resp: ", resp);
                        if (resp && typeof resp === "object" && resp.status === "error") {
                            alert(resp.error_message ? resp.error_message : "에러 발생! 잠시 후 다시 시도해주세요");
                            document.getElementById('message-to-send').disabled = true;
                            document.getElementById('send').disabled = true;
                            return; // 에러 발생 시 메시지 출력 없이 종료
                        }
                        resp_msg = (resp && typeof resp === "object") ? resp.response_message : resp;
                    } catch (err) {
                        console.error(err);
                        resp_msg = "앗, 서버랑 연결이 안 돼 ... 잠시 후 다시 시도해줘";
                    }
                    await showBubblePromise //답변이 출력되고 버블링이 발생되는 현상 제어
                    await waitPromise  //최소 2초는 버블링
                    this.showResponse(resp_msg); // 텍스트 메시지 처리
                },
                // Add a message when the Enter key is pressed (Shift+Enter는 줄바꿈)
                addMessageEnter: function (event) {
                    if (event.keyCode === 13 && !event.shiftKey) {
                        event.preventDefault();
                        this.addMessage();
                    }
                },
                // Scroll to the bottom of the chat history
                scrollToBottom: function () {
                    this.chatHistory.scrollTop = this.chatHistory.scrollHeight;
                },
                // 타임스탬프를 표시용 문자열로 변환
                // 오늘이면 'HH:MM', 오늘 이전이면 'MM.DD HH:MM' (24시간제)
                formatTimestamp: function (date) {
                    let target = (date instanceof Date) ? date : new Date(date);
                    if (isNaN(target.getTime())) {
                        target = new Date();
                    }
                    const pad = function (n) { return String(n).padStart(2, '0'); };
                    const hh = pad(target.getHours());
                    const mm = pad(target.getMinutes());

                    const now = new Date();
                    const isToday = target.getFullYear() === now.getFullYear()
                        && target.getMonth() === now.getMonth()
                        && target.getDate() === now.getDate();

                    if (isToday) {
                        return hh + ':' + mm;
                    }
                    return pad(target.getMonth() + 1) + '.' + pad(target.getDate()) + ' ' + hh + ':' + mm;
                },
            };
            chat.init();
        })();

    </script>
</body>

</html>
