<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 찾기 — 내 찐친 고비</title>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Lato:wght@400;700&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth-common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/forgot-password.css') }}">
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="logo">
            <div class="title">비밀번호 찾기</div>
        </div>

        {% if success_message %}
            <div class="success">{{ success_message }}</div>
            <div class="back-link">
                <a href="{{ url_for('login') }}">로그인하러 가기 →</a>
            </div>
        {% else %}
            <p class="intro">
                가입 시 등록한 <strong>아이디</strong>, <strong>이메일</strong>, <strong>표시 이름</strong>으로
                본인 확인 후 새 비밀번호를 설정할 수 있습니다.
            </p>

            <form method="post" action="{{ url_for('forgot_password') }}">
                <label for="login_id">아이디</label>
                <input type="text" id="login_id" name="login_id"
                       value="{{ submitted_login_id or '' }}"
                       autocomplete="username" autofocus required>

                <label for="email">이메일</label>
                <input type="email" id="email" name="email" autocomplete="email" required>

                <label for="display_name">표시 이름</label>
                <input type="text" id="display_name" name="display_name" required>

                <label for="new_password">새 비밀번호</label>
                <input type="password" id="new_password" name="new_password"
                       autocomplete="new-password" minlength="8" required>

                <label for="new_password_confirm">새 비밀번호 확인</label>
                <input type="password" id="new_password_confirm" name="new_password_confirm"
                       autocomplete="new-password" minlength="8" required>

                <div class="error">{{ error or '' }}</div>

                <button type="submit">비밀번호 변경</button>
            </form>

            <div class="back-link">
                <a href="{{ url_for('login') }}">← 로그인으로 돌아가기</a>
            </div>
        {% endif %}
    </div>
</body>
</html>
