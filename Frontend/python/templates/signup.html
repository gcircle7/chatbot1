<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 — 내 찐친 고비</title>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Lato:wght@400;700&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth-common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/signup.css') }}">
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="logo">
            <div class="title">회원가입</div>
        </div>

        <form method="post" action="{{ url_for('signup') }}">
            <label for="login_id">아이디</label>
            <input type="text" id="login_id" name="login_id"
                   autocomplete="username" autofocus required>

            <label for="email">이메일</label>
            <input type="email" id="email" name="email"
                   autocomplete="email" required>

            <label for="display_name">표시 이름 <span class="hint">(채팅 화면에 표시되는 이름)</span></label>
            <input type="text" id="display_name" name="display_name" required>

            <label for="password">비밀번호 <span class="hint">(8자 이상)</span></label>
            <input type="password" id="password" name="password"
                   autocomplete="new-password" minlength="8" required>

            <label for="password_confirm">비밀번호 확인</label>
            <input type="password" id="password_confirm" name="password_confirm"
                   autocomplete="new-password" minlength="8" required>

            <div class="error">{{ error or '' }}</div>

            <button type="submit">가입하기</button>
        </form>

        <div class="back-link">
            <a href="{{ url_for('login') }}">← 로그인으로 돌아가기</a>
        </div>

        <div class="demo-notice">
            가입 정보는 MySQL <strong>user_info</strong> 테이블에 저장됩니다.
            비밀번호는 bcrypt로 해시되어 보관됩니다.
        </div>
    </div>
</body>
</html>
